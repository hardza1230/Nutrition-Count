name: CI - Test & Lint

on:
  push:
    branches:
      - claude/meal-tracking-app-design-icd2uu
      - main
  pull_request:
    branches:
      - claude/meal-tracking-app-design-icd2uu
      - main

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    name: Lint & Type Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "No lint script configured"

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

  build-check:
    runs-on: ubuntu-latest
    name: Build Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: |
          # Check if app.json is valid
          jq . app.json > /dev/null || exit 1
          echo "✅ app.json valid"

          # Check if tsconfig is valid
          jq . tsconfig.json > /dev/null || exit 1
          echo "✅ tsconfig.json valid"

          # Check if package.json is valid
          jq . package.json > /dev/null || exit 1
          echo "✅ package.json valid"

  security-check:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug
        continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for large files
        run: |
          echo "Checking for large files..."
          find src -type f -size +1M -exec ls -lh {} \;
          echo "✅ No large source files"

      - name: Check unused dependencies
        run: |
          npm list --depth=0 2>/dev/null || true
          echo "Review dependencies manually"

      - name: Verify src structure
        run: |
          echo "Checking source structure..."
          [ -d "src/components" ] && echo "✅ components" || echo "❌ components"
          [ -d "src/screens" ] && echo "✅ screens" || echo "❌ screens"
          [ -d "src/services" ] && echo "✅ services" || echo "❌ services"
          [ -d "src/hooks" ] && echo "✅ hooks" || echo "❌ hooks"
          [ -d "src/store" ] && echo "✅ store" || echo "❌ store"
          [ -d "src/types" ] && echo "✅ types" || echo "❌ types"
          [ -d "src/utils" ] && echo "✅ utils" || echo "❌ utils"

  summary:
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, build-check, security-check, code-quality]
    if: always()
    name: Summary

    steps:
      - name: Check results
        run: |
          echo "## CI Results"
          echo "✅ Lint & Type Check: ${{ needs.lint-and-type-check.result }}"
          echo "✅ Build Check: ${{ needs.build-check.result }}"
          echo "✅ Security: ${{ needs.security-check.result }}"
          echo "✅ Code Quality: ${{ needs.code-quality.result }}"

      - name: Fail if needed
        if: contains(needs.*.result, 'failure')
        run: exit 1
