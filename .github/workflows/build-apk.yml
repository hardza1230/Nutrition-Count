name: Build APK

on:
  push:
    branches:
      - claude/meal-tracking-app-design-icd2uu
      - main
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      patch_version:
        description: 'Patch version (e.g., 1.0.1)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine version
        id: version
        run: |
          CURRENT_VERSION=$(jq -r '.expo.version' app.json)

          if [ -z "${{ github.event.inputs.patch_version }}" ]; then
            # Auto-increment patch version
            MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
            MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
            PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          else
            NEW_VERSION="${{ github.event.inputs.patch_version }}"
          fi

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update version in app.json
        run: |
          jq '.expo.version = "${{ steps.version.outputs.new_version }}" | .expo.runtimeVersion = "${{ steps.version.outputs.new_version }}"' app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Build Android APK
        run: |
          eas build --platform android --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Download APK artifact
        run: |
          # Get the latest build ID
          BUILD_ID=$(eas build:list --platform android --limit 1 --json | jq -r '.[0].id')
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV

          # Create download directory
          mkdir -p ./builds

          # Note: EAS doesn't provide direct download via CLI, check console or use webhook
          echo "Build ID: $BUILD_ID"
          echo "Download from: https://expo.dev/builds/$BUILD_ID"

      - name: Create release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          release_name: Release ${{ steps.version.outputs.new_version }}
          body: |
            ## Nutrition Count v${{ steps.version.outputs.new_version }}

            ### Changes
            - Auto-build APK from latest code
            - Previous version: ${{ steps.version.outputs.current_version }}

            ### Build Info
            - Build Date: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref }}

            ### Download
            Check EAS dashboard: https://expo.dev/builds/${{ env.BUILD_ID }}

            ### Installation
            ```bash
            adb install app-release.apk
            ```
          draft: false
          prerelease: false

      - name: Commit version bump
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add app.json
          git commit -m "Bump version to ${{ steps.version.outputs.new_version }}" || true
          git push origin ${{ github.ref }}

      - name: Notify success
        if: success()
        run: |
          echo "✅ APK build successful!"
          echo "Version: ${{ steps.version.outputs.new_version }}"
          echo "Check EAS dashboard for download"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ APK build failed"
          echo "Check logs above for details"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "No lint script"

      - name: Type check
        run: npx tsc --noEmit || echo "TypeScript check skipped"
